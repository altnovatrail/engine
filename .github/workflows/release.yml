# NovaTrail's shared release (R18 .github), pinned to a release of .github by SHA with its version
# beside it. RELEASE_LINE is the line the releases are numbered in; paths, what they are built
# from (R15 in docs/decisions.md). A commit of main whose CI has passed and which changes one of
# the paths since the release before it gets the next patch of the line, its tag and its one file,
# the archive of the code, signed; Go code takes the module by that tag.
name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_LINE: "0.1"

jobs:
  release:
    name: Release
    permissions:
      contents: write
      id-token: write
      actions: read
    uses: altnovatrail/.github/.github/workflows/release.yml@706f4067a66c91b0442033f82a7924eeb8b60497 # v0.1.21
    with:
      # What consumers of the Go module build, and what builds the release's file: the code but
      # its tests and their data, go.mod and go.sum, the license, and the recipe, the toolchain and
      # this workflow.
      # Tests, their data, the golden vectors and the documents change no release.
      paths: |
        *.go
        :(exclude)*_test.go
        :(exclude)testdata/**
        go.mod
        go.sum
        LICENSE
        .gitattributes
        justfile
        .devcontainer/Dockerfile
        .github/workflows/release.yml
