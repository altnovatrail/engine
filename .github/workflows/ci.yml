# NovaTrail's shared checks (R03 .github), pinned to a release of .github by SHA with its version
# beside it; Dependabot moves both. The repository's own jobs go beside them.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# The tag of sim and the SHA of its commit, for the jobs of the gate below, named once here: the
# recipes of the gate read them from this file.
env:
  SIM_TAG: v0.1.24
  SIM_COMMIT: 33d70f288682d95e12f6072c4e9ff09253417497

# A new push to a pull request cancels its older run; every commit to main is checked.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Secrets
    uses: altnovatrail/.github/.github/workflows/secrets.yml@f1c7e9e6f8245fdbdbc23c4091f3c26350e3a44e # v0.1.33

  # A pull request's commits are what it checks; a push to main has been checked as one.
  dco:
    name: DCO
    if: github.event_name == 'pull_request'
    uses: altnovatrail/.github/.github/workflows/dco.yml@f1c7e9e6f8245fdbdbc23c4091f3c26350e3a44e # v0.1.33

  documents:
    name: Documents
    uses: altnovatrail/.github/.github/workflows/documents.yml@f1c7e9e6f8245fdbdbc23c4091f3c26350e3a44e # v0.1.33

  # The repository's Go code, by its own ci- recipes in its toolchain stage, and the coverage of
  # its tests, which the shared workflow sends to Codecov (R16 .github). id-token: write is for its
  # coverage job alone, which asks for an OIDC token: a called workflow can only lower what this
  # job gives it. With same-bits it holds the bits the same on every build too (R10;
  # docs/architecture.md, section 3.7): "Go / targets", "Go / fma-diff", "Go / arm64" on arm64
  # hardware, and "Go / rules", the rules of code by the tool of .github and the lists of
  # .github/coderules.json — in place of this repository's own job, recipes and port of the test.
  go:
    name: Go
    permissions:
      contents: read
      id-token: write
    uses: altnovatrail/.github/.github/workflows/go.yml@f1c7e9e6f8245fdbdbc23c4091f3c26350e3a44e # v0.1.33
    with:
      same-bits: true

  # ReasonCode, ChoiceKind and RunEnd against cause.proto in the spec submodule, at the tag this
  # repository pins (docs/architecture.md, section 3.6; R09): the shared go.yml checks out no
  # submodule, and its test job skips this test, so this job checks it out and fails when the
  # file is missing. The rest of the tests run in the Go job.
  contracts:
    name: Contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      # The image of the toolchain stage and the Go caches by the shared composite action of the
      # same release of .github as go.yml, called twice with the check contracts, an entry of its own
      # (R49 .github; R28): before the work, the image from the cache of GitHub Actions by the hash of
      # the Dockerfile, built only on a miss and saved on a push to main alone, and GOMODCACHE,
      # GOCACHE and GOLANGCI_LINT_CACHE in one folder outside the checkout, by the exact key and
      # verified by go mod verify, or by the prefix without the hash of go.sum, the modules dropped
      # and the builds kept (R41 .github); after it, with save, the Go caches on a push to main, on a
      # miss of the exact key. The stage is toolchain, as for every job of go.yml that runs a test.
      # The go.sum files of the key are the spec submodule's too, which this job checks out.
      - name: Toolchain image and Go caches
        uses: altnovatrail/.github/.github/actions/toolchain@f1c7e9e6f8245fdbdbc23c4091f3c26350e3a44e # v0.1.33
        with:
          check: contracts

      - name: ci-contracts
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
              --env GOMODCACHE=/go-cache/mod --env GOCACHE=/go-cache/build --env GOLANGCI_LINT_CACHE=/go-cache/lint \
              --volume "$PWD:/work" --volume "$RUNNER_TEMP/go-cache:/go-cache" --workdir /work \
              novatrail-toolchain just ci-contracts

      - name: Go caches into the cache
        uses: altnovatrail/.github/.github/actions/toolchain@f1c7e9e6f8245fdbdbc23c4091f3c26350e3a44e # v0.1.33
        with:
          check: contracts
          save: "true"

  # The gate of sim (R17; R103 spec; repositories 4 spec): the choice of this commit on the bench,
  # its numbers held to the bands of sim's gate.json, on every pull request and every commit of
  # main. sim comes by the tag and the SHA of its commit in the env of the workflow, which the
  # recipes gate, gate-part and gate-check read and check against each other; learner-model, by the
  # commit gate.json names. They are inputs of a checkout, not a uses, so Dependabot does not move
  # them: a task of this repository raises them, by the order of releases of repositories 4 spec.
  # The gate runs as jobs, by sim's recipes of R67 sim (the third 2026-11-16 amendment to R17):
  # four parts, each its share of the learners into a file of parts, and after them the check
  # "Gate", the required one of the ruleset of main, which merges the parts and holds the numbers to
  # their bands. Those are the numbers of just gate to the bit: a learner comes from its seeds
  # alone, and sim's merge refuses a part missing, repeated or of another run. Every job runs in
  # the toolchain stage of sim's devcontainer at that tag, from the cache or built from its
  # checkout, with no context, and all on one kind of runner, since a part splits its share by the
  # runner's processors. The limit, 15 minutes a job as in sim's gate.yml, is a guard against a
  # hung run, not sim's budget. The runner is arm64, standard and free for public repositories
  # (sources 8.3): sim's gate runs about a minute faster there than on amd64 (measurements 3.1
  # spec), and the gate's numbers are the same to the bit on both: the engine's choice by R10, sim's
  # own as sim holds them at home on both (the second 2026-11-16 amendment to R17). The cache's
  # entry of the image is that of arm64: its key holds runner.arch.
  gate-part:
    name: Gate / part ${{ matrix.part }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        part: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: engine

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: altnovatrail/sim
          ref: ${{ env.SIM_COMMIT }}
          path: sim

      # The caches of Go between runs, by the steps of sim's gate.yml at SIM_COMMIT word for word:
      # GOCACHE and GOMODCACHE in one folder, by the module sums and the toolchain of sim, not by the
      # commits gate.json names, so a new pin builds its libraries on the cache of the one before,
      # restore-keys. A pull request only reads it, and the first part of a push saves it; this
      # workflow runs on no other event (R28, its third 2026-11-16 amendment).
      - name: Go cache
        id: go
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go
          key: gate-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sim/go.sum', 'sim/.devcontainer/Dockerfile') }}
          restore-keys: gate-${{ runner.os }}-${{ runner.arch }}-

      # sim's toolchain stage from the cache, by the three image steps of the composite action
      # toolchain of .github that "Contracts" calls, word for word but the Dockerfile, sim's at
      # SIM_COMMIT, which the key hashes: the action reads the Dockerfile of the checkout's root
      # alone, and this checkout is two trees. A tag of sim with another Dockerfile takes an entry
      # of its own, and one whose Dockerfile is engine's byte for byte shares the entry of
      # "Go / arm64", the job of go.yml on the same arm64 runner, which holds the same image (R28).
      # On a miss only the first part writes and saves the file, as in sim's gate.yml, so that the
      # parts do not save one key, and only on a push to main, as the action does: a pull request
      # reads main's entry and saves none.
      - name: Toolchain image from the cache
        id: toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/novatrail-toolchain.tar
          key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sim/.devcontainer/Dockerfile') }}

      - name: Toolchain image
        env:
          SAVE: ${{ matrix.part == 0 && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          STAGES: toolchain
        run: |
          # Each stage STAGES names, from its own file, novatrail-<stage>.tar, and as the one image
          # novatrail-toolchain, as spec's toolchain.sh names either stage (R47 .github): the job toolchain
          # builds and saves one, then the other, and every other job takes one.
          for stage in $STAGES; do
              case $stage in
                  toolchain | toolchain-core) ;;
                  *)
                      echo "::error::STAGES names ${stage}, which is neither toolchain nor toolchain-core."
                      exit 1
                      ;;
              esac
              tar=$RUNNER_TEMP/novatrail-$stage.tar
              restored=false
              if [ -f "$tar" ]; then
                  restored=true
                  if docker load --quiet --input "$tar" && docker image inspect novatrail-toolchain > /dev/null; then
                      rm -f -- "$tar"
                      echo "Toolchain image: ${stage} loaded from its file."
                      continue
                  fi
                  echo "::warning::The file of the ${stage} stage does not load as the image novatrail-toolchain: the image is built from the Dockerfile. A file from the cache does so on every run until its entry is deleted (gh cache delete) or the Dockerfile changes."
                  rm -f -- "$tar"
              fi
              docker build --target "$stage" --tag novatrail-toolchain - < sim/.devcontainer/Dockerfile
              # Only a job that saves writes the file. A file that came has its entry or its artifact
              # already, which no save replaces.
              if [ "$SAVE" = true ] && [ "$restored" = false ] && ! docker save --output "$tar" novatrail-toolchain; then
                  echo "::warning::The image of the ${stage} stage could not be saved: the jobs after this one and the next run build it again."
                  rm -f -- "$tar"
              fi
          done

      - name: Toolchain image into the cache
        if: steps.toolchain.outputs.cache-hit != 'true' && matrix.part == 0 && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/novatrail-toolchain.tar
          key: ${{ steps.toolchain.outputs.cache-primary-key }}

      - name: gate-part
        env:
          PART: ${{ matrix.part }}
          PARTS: ${{ strategy.job-total }}
        run: |
          mkdir -p "$RUNNER_TEMP/go" "$RUNNER_TEMP/parts"
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
              --env GOCACHE=/go/build --env GOMODCACHE=/go/mod --env SIM_DIR=/work/sim \
              --volume "$RUNNER_TEMP/go:/go" --volume "$RUNNER_TEMP/parts:/parts" \
              --volume "$PWD:/work" --workdir /work/engine \
              novatrail-toolchain just gate-part "$PART" "$PARTS" /parts

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-part-${{ matrix.part }}
          path: ${{ runner.temp }}/parts
          retention-days: 7
          if-no-files-found: error

      - name: Go cache into the cache
        if: github.event_name != 'pull_request' && matrix.part == 0 && steps.go.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go
          key: ${{ steps.go.outputs.cache-primary-key }}

  # The check after the parts, named as the gate was. It runs when a part failed too, and then
  # fails: a required check skipped would pass as green.
  gate:
    name: Gate
    needs: gate-part
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Parts
        env:
          PARTS_RESULT: ${{ needs.gate-part.result }}
        run: |
          if [ "$PARTS_RESULT" != success ]; then
              echo "::error::The parts of the gate did not all pass: $PARTS_RESULT. Their jobs say why."
              exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: engine

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: altnovatrail/sim
          ref: ${{ env.SIM_COMMIT }}
          path: sim

      # The caches of Go the parts took, from the same entry, which this job does not save.
      - name: Go cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go
          key: gate-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sim/go.sum', 'sim/.devcontainer/Dockerfile') }}
          restore-keys: gate-${{ runner.os }}-${{ runner.arch }}-

      # The image the parts took, from the same entry, by the same script; on a miss it is built and
      # not saved, since the first part saves it.
      - name: Toolchain image from the cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/novatrail-toolchain.tar
          key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sim/.devcontainer/Dockerfile') }}

      - name: Toolchain image
        env:
          SAVE: "false"
          STAGES: toolchain
        run: |
          # Each stage STAGES names, from its own file, novatrail-<stage>.tar, and as the one image
          # novatrail-toolchain, as spec's toolchain.sh names either stage (R47 .github): the job toolchain
          # builds and saves one, then the other, and every other job takes one.
          for stage in $STAGES; do
              case $stage in
                  toolchain | toolchain-core) ;;
                  *)
                      echo "::error::STAGES names ${stage}, which is neither toolchain nor toolchain-core."
                      exit 1
                      ;;
              esac
              tar=$RUNNER_TEMP/novatrail-$stage.tar
              restored=false
              if [ -f "$tar" ]; then
                  restored=true
                  if docker load --quiet --input "$tar" && docker image inspect novatrail-toolchain > /dev/null; then
                      rm -f -- "$tar"
                      echo "Toolchain image: ${stage} loaded from its file."
                      continue
                  fi
                  echo "::warning::The file of the ${stage} stage does not load as the image novatrail-toolchain: the image is built from the Dockerfile. A file from the cache does so on every run until its entry is deleted (gh cache delete) or the Dockerfile changes."
                  rm -f -- "$tar"
              fi
              docker build --target "$stage" --tag novatrail-toolchain - < sim/.devcontainer/Dockerfile
              # Only a job that saves writes the file. A file that came has its entry or its artifact
              # already, which no save replaces.
              if [ "$SAVE" = true ] && [ "$restored" = false ] && ! docker save --output "$tar" novatrail-toolchain; then
                  echo "::warning::The image of the ${stage} stage could not be saved: the jobs after this one and the next run build it again."
                  rm -f -- "$tar"
              fi
          done

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gate-part-*
          merge-multiple: true
          path: ${{ runner.temp }}/parts

      - name: gate-check
        run: |
          mkdir -p "$RUNNER_TEMP/go"
          set -o pipefail
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
              --env GOCACHE=/go/build --env GOMODCACHE=/go/mod --env SIM_DIR=/work/sim \
              --volume "$RUNNER_TEMP/go:/go" --volume "$RUNNER_TEMP/parts:/parts" \
              --volume "$PWD:/work" --workdir /work/engine \
              novatrail-toolchain just gate-check /parts | tee -a "$GITHUB_STEP_SUMMARY"
