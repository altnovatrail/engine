# NovaTrail's shared checks (R03 .github), pinned to a release of .github by SHA with its version
# beside it; Dependabot moves both. The repository's own jobs go beside them.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its older run; every commit to main is checked.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Secrets
    uses: altnovatrail/.github/.github/workflows/secrets.yml@fab102d8bbb4659575e107ee488e072aaaa71821 # v0.1.24

  # A pull request's commits are what it checks; a push to main has been checked as one.
  dco:
    name: DCO
    if: github.event_name == 'pull_request'
    uses: altnovatrail/.github/.github/workflows/dco.yml@fab102d8bbb4659575e107ee488e072aaaa71821 # v0.1.24

  documents:
    name: Documents
    uses: altnovatrail/.github/.github/workflows/documents.yml@fab102d8bbb4659575e107ee488e072aaaa71821 # v0.1.24

  # The repository's Go code, by its own ci- recipes in its toolchain stage, and the coverage of
  # its tests, which the shared workflow sends to Codecov (R16 .github). id-token: write is for its
  # coverage job alone, which asks for an OIDC token: a called workflow can only lower what this
  # job gives it. With same-bits it holds the bits the same on every build too (R10;
  # docs/architecture.md, section 3.7): "Go / targets", "Go / fma-diff", "Go / arm64" on arm64
  # hardware, and "Go / rules", the rules of code by the tool of .github and the lists of
  # .github/coderules.json — in place of this repository's own job, recipes and port of the test.
  go:
    name: Go
    permissions:
      contents: read
      id-token: write
    uses: altnovatrail/.github/.github/workflows/go.yml@fab102d8bbb4659575e107ee488e072aaaa71821 # v0.1.24
    with:
      same-bits: true

  # ReasonCode, ChoiceKind and RunEnd against cause.proto in the spec submodule, at the tag this
  # repository pins (docs/architecture.md, section 3.6; R09): the shared go.yml checks out no
  # submodule, and its test job skips this test, so this job checks it out and fails when the
  # file is missing. The rest of the tests run in the Go job.
  contracts:
    name: Contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      # The toolchain stage from the cache of GitHub Actions, by the steps of the shared go.yml of
      # v0.1.24 (R36 .github; the 2026-11-09 amendment to R31 spec; R28): the same file, path and
      # key, so the entry is the one go.yml's jobs fill and read on the same runner, and the image
      # is built from the Dockerfile only on a miss. The entry of main is filled by CI on a push to
      # main, and a pull request reads it.
      - name: Toolchain image from the cache
        id: toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/toolchain.tar
          key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.devcontainer/Dockerfile') }}

      - name: Toolchain image
        run: |
          tar=$RUNNER_TEMP/toolchain.tar
          restored=false
          if [ -f "$tar" ]; then
              restored=true
              if docker load --quiet --input "$tar" && docker image inspect toolchain > /dev/null; then
                  rm -f -- "$tar"
                  echo "Toolchain image: loaded from the cache."
                  exit 0
              fi
              echo "::warning::The cache's file of the toolchain stage does not load as the image toolchain: the image is built from the Dockerfile, on every run until the entry is deleted (gh cache delete) or the Dockerfile changes."
              rm -f -- "$tar"
          fi
          docker build --target toolchain --tag toolchain - < .devcontainer/Dockerfile
          # A file the cache gave has its entry already, which no save replaces.
          if [ "$restored" = false ] && ! docker save --output "$tar" toolchain; then
              echo "::warning::The image of the toolchain stage could not be saved for the cache: the next run builds it again."
              rm -f -- "$tar"
          fi

      - name: Toolchain image into the cache
        if: steps.toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/toolchain.tar
          key: ${{ steps.toolchain.outputs.cache-primary-key }}

      - name: ci-contracts
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
              --volume "$PWD:/work" --workdir /work \
              toolchain just ci-contracts

  # The gate of sim (R17; R103 spec; repositories 4 spec): the choice of this commit on the bench,
  # its numbers held to the bands of sim's gate.json, on every pull request and every commit of
  # main. sim comes by the tag and the SHA of its commit below, which the recipe gate reads and
  # checks against each other; learner-model, by the commit gate.json names. They are inputs of a
  # checkout, not a uses, so Dependabot does not move them: a task of this repository raises them,
  # by the order of releases of repositories 4 spec. The run goes in the toolchain stage of sim's
  # devcontainer at that tag, from the cache or built from its checkout, with no context. The limit
  # is a guard against a hung run, not sim's budget: sim v0.1.20 keeps the gate of v0.1.15 and
  # v0.1.17, whose 250 learners a cell are reckoned at about 12 to 13 minutes on a slow runner
  # without the Go cache (amendments of 2026-11-14 to R17; the 2026-11-15 one keeps the limit).
  gate:
    name: Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SIM_TAG: v0.1.20
      SIM_COMMIT: 63288d7631a6341333d1aa63975e67765de1b637
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: engine

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: altnovatrail/sim
          ref: ${{ env.SIM_COMMIT }}
          path: sim

      # sim's toolchain stage from the cache, by the steps of the job Contracts, keyed by the hash
      # of sim's Dockerfile at SIM_COMMIT: a tag of sim with another Dockerfile takes an entry of
      # its own, and one whose Dockerfile is engine's byte for byte shares the entry of go.yml's
      # jobs, which holds the same image (R28).
      - name: Toolchain image from the cache
        id: toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/toolchain.tar
          key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sim/.devcontainer/Dockerfile') }}

      - name: Toolchain image
        run: |
          tar=$RUNNER_TEMP/toolchain.tar
          restored=false
          if [ -f "$tar" ]; then
              restored=true
              if docker load --quiet --input "$tar" && docker image inspect toolchain > /dev/null; then
                  rm -f -- "$tar"
                  echo "Toolchain image: loaded from the cache."
                  exit 0
              fi
              echo "::warning::The cache's file of the toolchain stage does not load as the image toolchain: the image is built from the Dockerfile, on every run until the entry is deleted (gh cache delete) or the Dockerfile changes."
              rm -f -- "$tar"
          fi
          docker build --target toolchain --tag toolchain - < sim/.devcontainer/Dockerfile
          # A file the cache gave has its entry already, which no save replaces.
          if [ "$restored" = false ] && ! docker save --output "$tar" toolchain; then
              echo "::warning::The image of the toolchain stage could not be saved for the cache: the next run builds it again."
              rm -f -- "$tar"
          fi

      - name: Toolchain image into the cache
        if: steps.toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/toolchain.tar
          key: ${{ steps.toolchain.outputs.cache-primary-key }}

      - name: gate
        run: |
          set -o pipefail
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
              --env SIM_DIR=/work/sim \
              --volume "$PWD:/work" --workdir /work/engine \
              toolchain just gate | tee -a "$GITHUB_STEP_SUMMARY"
