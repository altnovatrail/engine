version: 2

updates:
  # The actions of the workflows, and the references to .github's shared workflows with them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3

  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
    cooldown:
      default-days: 3

  # The Go modules the code is built from, as in every Go repository of NovaTrail (architecture 3.3
  # .github). go.mod requires learner-model alone, and Dependabot does not raise it: a new version
  # comes by a task that holds its tag to the signed release by release-verify, and once the
  # baseline is out, through the gate of sim (R09 in docs/decisions.md; R77 spec; R103 spec), as
  # the consumers of spec leave its module out (R64 spec). The ecosystem stays all the same, as in
  # every Go repository, with nothing to raise. Go itself, in the Dockerfile, and the tools the
  # recipes run by `go run` at an exact version are not among them: those are raised by hand.
  # Neither is .devcontainer/gopls/, the lock file of gopls: its version goes up together with
  # GOPLS_VERSION in the Dockerfile, by hand (R13 in docs/decisions.md).
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: github.com/altnovatrail/learner-model
